version: "3.9"

services:
  mongo:
    image: mongo:7.0
    container_name: warrantyvault_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: warrantyvault
    volumes:
      - mongo_data:/data/db
    networks:
      - warrantyvault_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: warrantyvault_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/warrantyvault
      UPLOAD_DIR: /app/uploads
    volumes:
      - receipt_uploads:/app/uploads
    networks:
      - warrantyvault_net
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: warrantyvault_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - warrantyvault_net
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
    driver: local
  receipt_uploads:
    driver: local

networks:
  warrantyvault_net:
    driver: bridge
